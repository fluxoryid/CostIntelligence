name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'functions/**'
      - '*.js'
      - '*.html'
      - '*.css'
      - '*.json'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.assetsignore'
      - '_headers'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: costintelligence-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run production tests
        run: npm test

      - name: Syntax-check Worker
        run: node --check worker.js

      - name: Syntax-check browser modules
        run: |
          for f in app.js auth-sync.js cloud-sync.js source-engine.js providers.js governance-extensions.js procurement-ux.js category-cost-ux.js evidence-component-ux.js document-hub.js advanced-intelligence.js workflow-rbac.js learning-negotiation.js production-health.js uat-console.js password-recovery.js bahasa-id.js inaproc-intelligence.js; do
            node --check "$f"
          done

      - name: Deploy Cloudflare Worker + Static Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployed runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://costintelligence-pages.procurement-e61.workers.dev"
          EXPECTED_BUILD="$(sed -n "s/.*EXPECTED_WORKER_BUILD: '\([^']*\)'.*/\1/p" config.js | head -n1)"
          if [ -z "$EXPECTED_BUILD" ]; then
            echo "Unable to resolve EXPECTED_WORKER_BUILD from config.js"
            exit 1
          fi

          attempt=1
          matched=0
          while [ "$attempt" -le 15 ]; do
            if curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/version" -o /tmp/version.json; then
              CURRENT_BUILD="$(node -e 'const fs=require("fs");try{const v=JSON.parse(fs.readFileSync("/tmp/version.json","utf8"));process.stdout.write(String(v.buildId||""));}catch(e){}')"
              if [ "$CURRENT_BUILD" = "$EXPECTED_BUILD" ]; then
                matched=1
                break
              fi
              echo "Deployment propagation pending: expected $EXPECTED_BUILD, currently $CURRENT_BUILD"
            fi
            attempt=$((attempt + 1))
            sleep 3
          done

          if [ "$matched" -ne 1 ]; then
            echo "Expected build $EXPECTED_BUILD did not become active within verification window."
            cat /tmp/version.json || true
            exit 1
          fi

          node -e 'const fs=require("fs");const v=JSON.parse(fs.readFileSync("/tmp/version.json","utf8"));if(v.buildId!==process.argv[1]){console.error("Unexpected buildId:",v.buildId);process.exit(1)};console.log("Verified build:",v.buildId,"channel:",v.releaseChannel);' "$EXPECTED_BUILD"

          curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/health" -o /tmp/health.json
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));if(h.status!=="healthy"||h.buildId!==process.argv[1]){console.error(h);process.exit(1)};console.log("Health:",h.status,"runtime:",h.runtime);' "$EXPECTED_BUILD"

          curl --fail --silent --show-error --max-time 20 "$BASE_URL/config.js" -o /tmp/config.js
          grep -q "https://bobrilytsufxtqqqgaym.supabase.co" /tmp/config.js
          if grep -Eqi "SUPABASE_SERVICE_ROLE|SUPABASE_SECRET|sb_secret_|service_role_key[[:space:]]*[:=]" /tmp/config.js; then
            echo "Unsafe private Supabase credential found in deployed config.js"
            exit 1
          fi
          echo "Verified deployed Supabase project URL and absence of private Supabase credentials."

      - name: Probe official-source API routes
        shell: bash
        run: |
          set -u
          BASE_URL="https://costintelligence-pages.procurement-e61.workers.dev"
          for path in             "/api/fx-usd-idr"             "/api/bi-rate"             "/api/kurs-pajak?currency=USD"             "/api/bps-inflation"             "/api/esdm-electricity"
          do
            code="$(curl --silent --show-error --max-time 25 -o /tmp/provider.json -w "%{http_code}" "$BASE_URL$path" || true)"
            echo "$path -> HTTP $code"
            if [ -s /tmp/provider.json ]; then
              node -e 'const fs=require("fs");try{const x=JSON.parse(fs.readFileSync("/tmp/provider.json","utf8"));const summary={sourceState:x.sourceState||null,source:x.source||x.provider||null,error:x.error||null};console.log(JSON.stringify(summary).slice(0,800));if(process.argv[1]!=="200")console.log("diagnostic",JSON.stringify(x).slice(0,2400));}catch(e){console.log("non-JSON provider response")}' "$code"
            fi
          done
